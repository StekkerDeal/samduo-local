name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: device_model
    attributes:
      label: Device model
      options:
        - Nex E6000
        - Nex E6000H
        - Nex P2800 Pro
        - Nex BP2800
        - Not device-specific
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Problem or use case
      placeholder: "I want to ... because ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context
